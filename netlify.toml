# Remyndrs static site configuration
[build]
  publish = "."
  command = "bash build.sh"

# Redirect www to non-www (all protocols)
[[redirects]]
  from = "https://www.remyndrs.com/*"
  to = "https://remyndrs.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.remyndrs.com/*"
  to = "https://remyndrs.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://remyndrs.com/*"
  to = "https://remyndrs.com/:splat"
  status = 301
  force = true

# Redirect /index.html to / to avoid duplicate content
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# Redirect rules (proxy API requests to backend)
[[redirects]]
  from = "/api/signup"
  to = "https://sms-reminders-api-1gmm.onrender.com/api/signup"
  status = 200
  force = true

[[redirects]]
  from = "/updates"
  to = "https://sms-reminders-api-1gmm.onrender.com/updates"
  status = 200
  force = true

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Cache static assets for 1 year
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache HTML for shorter period
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
